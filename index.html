<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Counter App</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
     <main class="app-card">
 <header class="app-header">
      <h1 id="app-title">Counter App</h1>
      <p class="subtitle">Hackathon practice</p>
    </header>


    <div class="counter-display">
      <span id="count">0</span>
    </div>


    <div class="button-group">
      <button id="decrement-btn" class="btn btn-secondary">- Decrease</button>
      <button id="reset-btn" class="btn btn-outline">Reset</button>
      <button id="increment-btn" class="btn btn-primary">+ Increase</button>
    </div>
   </main>
   <link rel="javascript" href="assets/js/script.js">
</body>
<footer>
<p>Team members: Marcel, Amir, Charles</p>
</footer>
</html>
